<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <title>{% block title %} Spillpunkt {% endblock %}</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'myapp/style/style.css' %}" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="#"> Spillpunkt</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div id="cookie-consent-bar" class="cookie-consent d-none">
        <div class="cookie-consent-content">
            <p>Vi bruker cookies for å forbedre opplevelsen din. Ved å bruke nettstedet godtar du dette.</p>
            <button id="cookie-accept" class="btn">OK, forstått</button>
            <button id="cookie-decline" class="btn btn-secondary">Nei takk</button>
        </div>
    </div>

    <div class="container">{% block content %} {% endblock %}</div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var bar = document.getElementById('cookie-consent-bar');
            var accepted = localStorage.getItem('cookiesAccepted');

            if (!accepted) {
                bar.classList.remove('d-none');
            }

            document.getElementById('cookie-accept').addEventListener('click', function() {
                localStorage.setItem('cookiesAccepted', 'yes');
                bar.classList.add('d-none');
            });

            document.getElementById('cookie-decline').addEventListener('click', function() {
                localStorage.setItem('cookiesAccepted', 'no');
                bar.classList.add('d-none');
            });
        });
    </script>
</body>
</html>
